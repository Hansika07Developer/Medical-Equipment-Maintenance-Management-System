{% extends "base.html" %}{% block title %}Sign in | MEMMS{% endblock %}
{% block content %}<div class="login-wrap"><div class="card shadow border-0"><div class="card-body p-4 p-md-5">
<div class="text-center mb-4"><div class="brand-mark">M</div><h3 class="mt-3">Welcome to MEMMS</h3><p class="text-secondary">Medical Equipment Maintenance Management</p></div>
<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<label class="form-label">Email address</label><input class="form-control mb-3" type="email" name="email" required autofocus>
<label class="form-label">Password</label><input class="form-control mb-3" type="password" name="password" required>
<div class="form-check mb-3"><input class="form-check-input" type="checkbox" name="remember" id="remember"><label for="remember" class="form-check-label">Remember me</label></div>
<button class="btn btn-primary w-100">Sign in</button></form>
<div class="small text-secondary mt-3">Ask your system administrator for an account. Public registration is disabled.</div>
</div></div></div>{% endblock %}
